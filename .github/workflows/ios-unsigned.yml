name: iOS (sem assinatura)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ios-unsigned:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Restaurar GoogleService-Info.plist (opcional)
        if: ${{ env.GOOGLE_SERVICE_INFO_PLIST != '' }}
        run: echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Ler versão do pubspec
        id: version
        run: echo "version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')" >> "$GITHUB_OUTPUT"

      - name: flutter pub get
        run: flutter pub get

      - name: Build iOS (sem assinatura)
        run: flutter build ios --release --no-codesign

      - name: Empacotar .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr app-unsigned.ipa Payload

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: rokamoka-ios-unsigned-${{ steps.version.outputs.version }}-run${{ github.run_number }}
          path: app-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
